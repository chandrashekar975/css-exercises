<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header class="header">
        <h1>Student Management Dashboard</h1>
    </header>
    <aside class="aside">
        <h2>Quick Actions</h2>
        <ul>
            <li><a href="#">Add Student</a></li>
            <li><a href="#">Edit Student</a></li>
            <li><a href="#">Delete Student</a></li>
        </ul>
    </aside>
    <main class="main">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Alice</td>
                    <td>20</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Bob</td>
                    <td>22</td>
                    <td>B</td>
                </tr>
                <tr>
                    <td>Charlie</td>
                    <td>19</td>
                    <td>A-</td>
                </tr>
            </tbody>
        </table>
    </main>
    
</body>
</html>
